# Append to ~/.codex/config.toml (or $CODEX_HOME/config.toml).
# Use the native XAX-built executable; no Python or MCP SDK is launched by the server.
[mcp_servers.xax]
command = "C:/ABSOLUTE/PATH/TO/xax-mcp-native.exe"
args = ["--read-only"]
# The native server answers initialize in about 12 ms.  Keep generous tool timeouts for future compiler-backed
# tools; today they return a structured "unsupported" error immediately.
startup_timeout_sec = 30
tool_timeout_sec = 180
