# Append to the host's config.toml. Replace these absolute paths for your installation.
# Native STDIO; execution rights remain with the host owner.
[mcp_servers.xax]
command = "D:/Tools/XAX-MCP/native/xax-mcp-native.exe"
args = ["--read-only"]
startup_timeout_sec = 30
tool_timeout_sec = 180

[mcp_servers.xax.env]
XAX_MCP_COMPILER = "D:/Tools/XAX/compiler/bootstrap/windows/xaxc-windows-x86_64.exe"
XAX_MCP_STORE = "D:/Tools/XAX-MCP/native/xax-mcp-seed.xax"
XAX_MCP_WORK = "D:/Private/XAX-MCP-work"
