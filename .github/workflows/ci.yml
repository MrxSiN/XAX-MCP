name: native-windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      XAXC: ${{ github.workspace }}/.xax-upstream/compiler/bootstrap/windows/xaxc-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - name: Check out the immutable XAX native dependency independently
        uses: actions/checkout@v4
        with:
          repository: MrxSiN/XAX
          ref: af376e8a8a1ac5635bcad459cb7063ef0b326430
          path: .xax-upstream

      # PowerShell is external CI/test orchestration. All canonical construction,
      # verification, compilation, protocol handling and execution run in native XAX.
      - name: Replay semantic transactions and rebuild native programs twice
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $compiler=$env:XAXC
          $dependency=Get-Content native/xax-dependency.json -Raw|ConvertFrom-Json
          if((Get-FileHash $compiler).Hash.ToLowerInvariant()-ne$dependency.seed_sha256){throw 'Wrong XAX seed'}
          New-Item -ItemType Directory -Force build/replay,build/rebuild | Out-Null
          function Native([string[]]$Arguments){& $compiler @Arguments;if($LASTEXITCODE-ne0){throw "Native compiler rejected/declined: $($Arguments[0]) ($LASTEXITCODE)"}}
          $status=Get-Content native/release-status.json -Raw|ConvertFrom-Json
          foreach($a in $status.artifacts){if((Get-FileHash $a.path).Hash.ToLowerInvariant()-ne$a.sha256-or(Get-Item $a.path).Length-ne$a.bytes){throw "Artifact identity differs: $($a.path)"}}
          $manifest=Get-Content native/transactions/20261027/manifest.json -Raw|ConvertFrom-Json
          Copy-Item $manifest.base build/replay/current.xax -Force
          foreach($record in $manifest.records){
           if((Get-FileHash $record.path).Hash.ToLowerInvariant()-ne$record.sha256){throw 'Mutation carrier identity differs'}
           Native @('edit','build/replay/current.xax',$record.path,'build/replay/next.xax')
           Native @('verify','build/replay/next.xax','build/replay/verify.diag')
           Move-Item build/replay/next.xax build/replay/current.xax -Force
          }
          if((Get-FileHash build/replay/current.xax).Hash-ne(Get-FileHash native/xax-mcp-native-gen1.xax).Hash){throw 'Transaction replay differs from canonical source'}
          $increment=Get-Content native/transactions/20261110-host-paths/manifest.json -Raw|ConvertFrom-Json
          foreach($kind in @('server','sandbox')){
           $chain=$increment.$kind;Copy-Item $chain.base "build/replay/$kind.current.xax" -Force
           foreach($record in $chain.records){
            if((Get-FileHash $record.path).Hash.ToLowerInvariant()-ne$record.sha256){throw 'Increment record identity differs'}
            Native @('edit',"build/replay/$kind.current.xax",$record.path,"build/replay/$kind.next.xax")
            Native @('verify',"build/replay/$kind.next.xax","build/replay/$kind.diag")
            Move-Item "build/replay/$kind.next.xax" "build/replay/$kind.current.xax" -Force
           }
           if((Get-FileHash "build/replay/$kind.current.xax").Hash-ne(Get-FileHash $chain.final).Hash){throw "Increment replay differs: $kind"}
          }
          Native @('resolve','native/xax-mcp-native-gen3.xax','build/rebuild/server-snapshot.xax')
          if((Get-FileHash build/rebuild/server-snapshot.xax).Hash-ne(Get-FileHash native/xax-mcp-native-snapshot.xax).Hash){throw 'Resolved snapshot differs'}
          foreach($attempt in 1..2){
           Native @('build','build/rebuild/server-snapshot.xax',"build/rebuild/server-$attempt.exe","build/rebuild/server-$attempt.prov")
           if((Get-FileHash "build/rebuild/server-$attempt.exe").Hash-ne(Get-FileHash native/xax-mcp-native.exe).Hash){throw 'Native server rebuild differs'}
           if((Get-FileHash "build/rebuild/server-$attempt.prov").Hash-ne(Get-FileHash native/xax-mcp-native.prov).Hash){throw 'Native provenance differs'}
          }
          Native @('verify','native/xax-mcp-sandbox-gen1.xax','build/rebuild/sandbox.diag')
          Native @('resolve','native/xax-mcp-sandbox-gen1.xax','build/rebuild/sandbox-snapshot.xax')
          if((Get-FileHash build/rebuild/sandbox-snapshot.xax).Hash-ne(Get-FileHash native/xax-mcp-sandbox-snapshot.xax).Hash){throw 'Sandbox snapshot differs'}
          foreach($attempt in 1..2){
           Native @('build','build/rebuild/sandbox-snapshot.xax',"build/rebuild/sandbox-$attempt.exe","build/rebuild/sandbox-$attempt.prov")
           if((Get-FileHash "build/rebuild/sandbox-$attempt.exe").Hash-ne(Get-FileHash native/xax-mcp-sandbox.exe).Hash){throw 'Sandbox rebuild differs'}
           if((Get-FileHash "build/rebuild/sandbox-$attempt.prov").Hash-ne(Get-FileHash native/xax-mcp-sandbox.prov).Hash){throw 'Sandbox provenance differs'}
          }
          $probes=Get-Content tests/security/executor-input/manifest.json -Raw|ConvertFrom-Json
          foreach($probe in $probes.fixtures){
           $source=($probe.artifacts|Where-Object path -Like '*.xax').path;$edit=($probe.artifacts|Where-Object path -Like '*.edit').path
           $exe=($probe.artifacts|Where-Object path -Like '*.exe').path;$prov=($probe.artifacts|Where-Object path -Like '*.prov').path
           foreach($a in $probe.artifacts){if((Get-FileHash $a.path).Hash.ToLowerInvariant()-ne$a.sha256){throw 'Probe artifact identity differs'}}
           Native @('edit',$probes.base,$edit,'build/replay/probe.xax');Native @('verify','build/replay/probe.xax','build/replay/probe.diag')
           if((Get-FileHash build/replay/probe.xax).Hash-ne(Get-FileHash $source).Hash){throw 'Probe replay differs'}
           Native @('resolve',$source,'build/rebuild/probe-snapshot.xax');Native @('build','build/rebuild/probe-snapshot.xax','build/rebuild/probe.exe','build/rebuild/probe.prov')
           if((Get-FileHash build/rebuild/probe.exe).Hash-ne(Get-FileHash $exe).Hash-or(Get-FileHash build/rebuild/probe.prov).Hash-ne(Get-FileHash $prov).Hash){throw 'Probe rebuild differs'}
          }
          Write-Output 'Verified 46 base + 19 increment exact-root edits, native probes and two byte-identical builds of each executor'

      - name: Replay read-only STDIO protocol golden responses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = @(Get-Content tests/protocol/readonly.requests.ndjson | & native/xax-mcp-native.exe --read-only)
          if ($LASTEXITCODE -ne 0) { throw 'Native server failed' }
          $expected = @(Get-Content tests/protocol/readonly.responses.ndjson)
          if ($actual.Count -ne $expected.Count -or (Compare-Object $expected $actual -SyncWindow 0)) { throw 'STDIO fixture differs' }
          $actual | Set-Content build/readonly.responses.ndjson -Encoding utf8NoBOM

      - name: Construct, build, confine, reject invalid requests and isolate clients
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=$PWD.Path
          $compiler=$env:XAXC
          $server=Join-Path $repo 'native/xax-mcp-native.exe'
          $fixtures=Get-Content tests/protocol/native-sessions.json -Raw|ConvertFrom-Json -Depth 80
          New-Item -ItemType Directory -Force build/native-sessions | Out-Null
          $observed=[Collections.Generic.List[string]]::new();$script:timings=[Collections.Generic.List[object]]::new()
          function Start-Server([string]$Flags,[string]$Directory,[string]$Store=(Join-Path $repo 'native/xax-mcp-seed.xax')){
           New-Item -ItemType Directory -Force $Directory|Out-Null
           $info=[Diagnostics.ProcessStartInfo]::new($server);$info.UseShellExecute=$false;$info.CreateNoWindow=$true;$info.Arguments=$Flags
           $info.RedirectStandardInput=$true;$info.RedirectStandardOutput=$true;$info.RedirectStandardError=$true;$info.StandardInputEncoding=[Text.UTF8Encoding]::new($false)
           $info.Environment['XAX_MCP_COMPILER']=$compiler;$info.Environment['XAX_MCP_STORE']=$Store;$info.Environment['XAX_MCP_WORK']=$Directory;$info.Environment.Remove('XAX_MCP_CONSTRUCT')|Out-Null
           return [Diagnostics.Process]::Start($info)
          }
          function Exchange($Process,$Request){
           $wire=ConvertTo-Json -InputObject $Request -Compress -Depth 70;$watch=[Diagnostics.Stopwatch]::StartNew();$Process.StandardInput.WriteLine($wire);$Process.StandardInput.Flush()
           $pending=$Process.StandardOutput.ReadLineAsync();if(!$pending.Wait(30000)){throw 'Response timeout'};$watch.Stop();if($null-eq$pending.Result){throw 'Unexpected EOF'}
           $response=ConvertFrom-Json -InputObject $pending.Result -Depth 80
           if($response.jsonrpc-ne'2.0'-or$response.id-ne$Request.id){throw 'Invalid protocol response'}
           $observed.Add($pending.Result);$script:timings.Add(@{method=$Request.method;tool=$Request.params.name;ms=$watch.Elapsed.TotalMilliseconds})
           if($Request.method-eq'initialize'){$Process.StandardInput.WriteLine('{"jsonrpc":"2.0","method":"notifications/initialized"}');$Process.StandardInput.Flush()}
           return $response
          }
          function Stop-Server($Process){
           $Process.StandardInput.Close();if(!$Process.WaitForExit(30000)){$Process.Kill($true);throw 'Shutdown timed out'}
           if($Process.ExitCode-ne0-or$Process.StandardOutput.ReadToEnd()-ne''-or$Process.StandardError.ReadToEnd()-ne''){throw 'Unclean shutdown/protocol pollution'};$Process.Dispose()
          }
          foreach($session in $fixtures.sessions){
           $work=Join-Path $repo ('build/native-sessions/'+$session.name);New-Item -ItemType Directory -Force $work|Out-Null;Copy-Item native/xax-mcp-seed.xax (Join-Path $work 'current.xax') -Force
           $process=Start-Server $session.flags $work
           try{
            foreach($exchange in $session.exchanges){
             $response=Exchange $process $exchange.request
             foreach($property in $exchange.expected.PSObject.Properties){$value=$response;foreach($part in $property.Name.Split('.')){$value=$value.$part};if($value-ne$property.Value){throw "Unexpected $($session.name) response field $($property.Name): $value"}}
             if($null-ne$response.result.structuredContent){$text=$response.result.content[0].text|ConvertFrom-Json -Depth 80;if($text.ok-ne$response.result.structuredContent.ok-or$response.result.isError-eq$text.ok){throw 'Tool text/structured/error mismatch'}}
             if($exchange.request.method-eq'tools/list'){$schemas=Get-Content schemas/tools-v2.json -Raw|ConvertFrom-Json -Depth 80;if(($response.result|ConvertTo-Json -Compress -Depth 80)-ne($schemas|ConvertTo-Json -Compress -Depth 80)){throw 'Published tools schema differs'}}
            }
           }finally{Stop-Server $process}
           & $compiler verify (Join-Path $work 'current.xax') (Join-Path $work 'candidate.diag');if($LASTEXITCODE-ne0){throw 'Published current store invalid'}
           if($session.name-in@('invalid-candidate','exact-root')){
            if((Get-FileHash (Join-Path $work 'current.xax')).Hash-ne(Get-FileHash native/xax-mcp-seed.xax).Hash){throw 'Rejected mutation changed canonical store'}
            if(Test-Path (Join-Path $work 'next.xax')){throw 'Rejected candidate leaked'}
           }
           if(Test-Path (Join-Path $work '.xax-mcp.lock')){throw 'Lease leaked on exit'}
          }
          # Two independent processes must never operate on shared compiler scratch concurrently.
          $shared=Join-Path $repo 'build/native-sessions/shared';$owner=Start-Server '' $shared;$waiter=Start-Server '' $shared
          $init=@{jsonrpc='2.0';id=1;method='initialize';params=@{protocolVersion='2025-11-25';capabilities=@{};clientInfo=@{name='native-ci';version='1'}}};$query=@{jsonrpc='2.0';id=2;method='tools/call';params=@{name='xax_query';arguments=@{}}}
          try{
           Exchange $owner $init|Out-Null;Exchange $waiter $init|Out-Null
           $root=(Exchange $owner $query).result.structuredContent;if(!$root.ok){throw 'Initial lease refused'}
           $busy=(Exchange $waiter $query).result.structuredContent;if($busy.ok-or$busy.error.code-ne'workspace_busy'){throw 'Shared workdir accepted concurrently'}
           $owner.Kill($true);$owner.WaitForExit();$owner.Dispose();$owner=$null
           $retry=(Exchange $waiter $query).result.structuredContent;if(!$retry.ok-or$retry.root-ne$root.root){throw 'Lease not released on crash'}
          }finally{if($null-ne$owner){Stop-Server $owner};Stop-Server $waiter}
          if(Test-Path (Join-Path $shared '.xax-mcp.lock')){throw 'Crash lease leaked'}
          # Synthetic operator transport only; every observer and worker below is native XAX.
          function Start-Probe([string]$Name){
           $store=Join-Path $repo "tests/security/executor-input/$Name.xax";$directory=Join-Path $repo "build/native-sessions/probe-$Name"
           New-Item -ItemType Directory -Force $directory|Out-Null;Copy-Item $store (Join-Path $directory 'current.xax') -Force
           $p=Start-Server '--allow-execute' $directory $store;Exchange $p $init|Out-Null;return $p
          }
          function Run-Execute($Process,$Arguments){
           $response=Exchange $Process @{jsonrpc='2.0';id=200;method='tools/call';params=@{name='xax_execute';arguments=$Arguments}}
           $content=$response.result.structuredContent;$text=$response.result.content[0].text|ConvertFrom-Json -Depth 80
           if($response.result.isError-eq$content.ok-or($text|ConvertTo-Json -Compress -Depth 80)-ne($content|ConvertTo-Json -Compress -Depth 80)){throw 'Execution text/structured/error framing mismatch'}
           return $content
          }
          $cases=Get-Content tests/security/executor-input/cases.json -Raw|ConvertFrom-Json
          $p=Start-Probe 'io-echo-probe'
          try{foreach($size in $cases.binary_sizes){
           $bytes=[byte[]]::new($size);for($i=0;$i-lt$size;$i++){$bytes[$i]=[byte]($i-band255)};$hex=[Convert]::ToHexString($bytes).ToLowerInvariant()
           $r=Run-Execute $p @{stdin_hex=$hex};if(!$r.ok-or$r.exit_code-ne7-or$r.stdout_hex-ne$hex-or$r.stderr_hex-ne$hex-or$r.stdout_bytes-ne$size-or$r.stderr_bytes-ne$size){throw 'Binary EOF/stream mismatch'}
          }}finally{Stop-Server $p}
          $p=Start-Probe 'stream-separation-probe'
          try{$r=Run-Execute $p @{};if(!$r.ok-or$r.stdout_hex-ne'4f55540a'-or$r.stderr_hex-ne'4552520a'-or$r.stdout_bytes-ne4-or$r.stderr_bytes-ne4){throw 'Distinct stdout/stderr bytes were mixed'}}finally{Stop-Server $p}
          $p=Start-Probe 'argv-probe'
          try{
           $expectedArgs=@($cases.args)+@($cases.extra_args)
           $r=Run-Execute $p @{args=$expectedArgs};$bytes=[Convert]::FromHexString($r.stdout_hex);$count=[BitConverter]::ToUInt32($bytes,0);$at=4
           if(!$r.ok-or$count-ne$expectedArgs.Count){throw 'Argv count mismatch'}
           for($i=0;$i-lt$count;$i++){$units=[BitConverter]::ToUInt32($bytes,$at);$at+=4;$arg=[Text.Encoding]::Unicode.GetString($bytes,$at,2*$units);$at+=2*$units;if($arg-cne$expectedArgs[$i]){throw 'Independent argv mismatch'}}
           if($at-ne$bytes.Length){throw 'Incomplete argv observation'}
          }finally{Stop-Server $p}
          foreach($case in $cases.resource_cases){$p=Start-Probe $case.fixture;try{
           $r=Run-Execute $p @{};if($null-ne$case.error){if($r.ok-or$r.error-ne$case.error-or$r.flags-ne$case.flags){throw 'Resource failure mismatch'}}
           elseif(!$r.ok-or$r.stdout_bytes-ne$case.stdout_bytes){throw 'Exact output boundary mismatch'}
           if($case.fixture-eq'cpu-probe'-and($r.user_cpu_100ns+$r.kernel_cpu_100ns-lt50000000)){throw 'CPU limit was not actually observed'}
           if($r.peak_memory_bytes-le0){throw 'Missing memory observation'}
          }finally{Stop-Server $p}}
          $p=Start-Probe 'environment-probe'
          try{$r=Run-Execute $p @{};$keys=@([Text.Encoding]::Unicode.GetString([Convert]::FromHexString($r.stdout_hex)).Split([char]0)|Where-Object{$_}|ForEach-Object{$_.Split('=')[0]}|Sort-Object)
           if(!$r.ok-or(Compare-Object ($cases.environment_keys|Sort-Object) $keys)){throw 'Ambient child environment leaked or observation incomplete'}
          }finally{Stop-Server $p}
          $malformedWork=Join-Path $repo 'build/native-sessions/executor-malformed';New-Item -ItemType Directory -Force $malformedWork|Out-Null
          $p=Start-Server '--allow-execute' $malformedWork
          try{Exchange $p $init|Out-Null;foreach($case in $cases.malformed){
           $wire='{"jsonrpc":"2.0","id":201,"method":"tools/call","params":{"name":"xax_execute","arguments":'+$case.arguments_json+'}}'
           $p.StandardInput.WriteLine($wire);$p.StandardInput.Flush();$pending=$p.StandardOutput.ReadLineAsync();if(!$pending.Wait(10000)){throw 'Malformed response timeout'};$r=$pending.Result|ConvertFrom-Json -Depth 80
           if($null-ne$case.expected.jsonrpc_error){if($r.error.code-ne$case.expected.jsonrpc_error){throw 'Malformed JSON accepted'}}elseif($r.result.structuredContent.ok-or$r.result.structuredContent.error.code-ne'invalid_request'){throw 'Malformed tool arguments accepted'}
          }
          foreach($executeArguments in @(@{stdin_hex=('00'*262145)},@{args=(@('')*65)},@{args=@(('x'*8193))})){$r=Run-Execute $p $executeArguments;if($r.ok-or$r.error.code-ne'invalid_request'){throw 'Exceeded input/argument bound accepted'}}
          if(Test-Path (Join-Path $malformedWork 'artifact.exe')){throw 'Malformed requests launched compiler work'}
          }finally{Stop-Server $p}
          $p=Start-Server '--allow-execute' (Join-Path $repo 'build/native-sessions/executor-boundaries')
          try{Exchange $p $init|Out-Null;foreach($executeArguments in @(@{args=(@('')*64)},@{args=@(('x'*8192))},@{args=@();stdin_hex=''})){$r=Run-Execute $p $executeArguments;if(!$r.ok-or$r.exit_code-ne40){throw 'Exact argument boundary rejected'}}}finally{Stop-Server $p}
          $lockedWork=Join-Path $repo 'build/native-sessions/executor-locked-cleanup';New-Item -ItemType Directory -Force (Join-Path $lockedWork 'exec')|Out-Null
          $lockedFile=[IO.File]::Open((Join-Path $lockedWork 'exec/sandbox-result.bin'),[IO.FileMode]::OpenOrCreate,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)
          $p=Start-Server '--allow-execute' $lockedWork
          try{Exchange $p $init|Out-Null;$r=Run-Execute $p @{};if($r.ok-or$r.error-ne'cleanup_failed'-or(Test-Path (Join-Path $lockedWork 'exec/sandbox-run'))){throw 'Failed cleanup did not refuse child execution'}}finally{$lockedFile.Dispose();Stop-Server $p}
          # Status-only native fixtures verify protocol mapping, not forced WinAPI failures.
          $realServer=$server
          foreach($code in @(7,8,9,10)){
           $faultDirectory=Join-Path $repo "build/native-sessions/launcher-status-$code";New-Item -ItemType Directory -Force $faultDirectory|Out-Null
           Copy-Item $realServer (Join-Path $faultDirectory 'xax-mcp-native.exe') -Force
           Copy-Item "tests/security/executor-input/launcher-status-$code-probe.exe" (Join-Path $faultDirectory 'xax-mcp-sandbox.exe') -Force
           $server=Join-Path $faultDirectory 'xax-mcp-native.exe';$p=Start-Server '--allow-execute' (Join-Path $faultDirectory 'work')
           try{Exchange $p $init|Out-Null;$r=Run-Execute $p @{};$expectedError=@{7='launcher_setup_failed';8='measurement_failed';9='incomplete_transport';10='cleanup_failed'}[$code]
            if($r.ok-or$r.error-ne$expectedError-or$null-ne$r.user_cpu_100ns-or$null-ne$r.peak_memory_bytes){throw 'Launcher failure mapping or unknown-measurement handling differs'}
           }finally{Stop-Server $p;$server=$realServer}
          }
          $outside=Join-Path $repo 'build/native-sessions/outside-fixture.bin';[IO.File]::WriteAllBytes($outside,[byte[]](0..255))
          $peer=[Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback,9)
          try{$peer.Start()}catch{throw 'BLOCKED: synthetic loopback peer cannot listen on port 9'}
          $p=Start-Probe 'confinement-read-network-probe'
          try{
           $r=Run-Execute $p @{args=@($outside);stdin_hex='00ff0a'};$bytes=[Convert]::FromHexString($r.stdout_hex)
           if(!$r.ok-or$bytes.Length-ne24-or[BitConverter]::ToUInt32($bytes,0)-ne1-or[BitConverter]::ToUInt32($bytes,4)-ne5-or[BitConverter]::ToUInt32($bytes,20)-ne1-or$peer.Pending()){throw 'Native token/filesystem/live-peer isolation mismatch'}
           $controlInfo=[Diagnostics.ProcessStartInfo]::new((Join-Path $repo 'tests/security/executor-input/confinement-read-network-probe.exe'))
           $controlInfo.UseShellExecute=$false;$controlInfo.CreateNoWindow=$true;$controlInfo.ArgumentList.Add($outside);$controlInfo.RedirectStandardOutput=$true;$controlInfo.RedirectStandardError=$true
           $control=[Diagnostics.Process]::Start($controlInfo);$controlBytes=[IO.MemoryStream]::new();$copy=$control.StandardOutput.BaseStream.CopyToAsync($controlBytes)
           if(!$control.WaitForExit(5000)){ $control.Kill();throw 'Native network positive-control timeout' };$copy.GetAwaiter().GetResult()|Out-Null
           $bytes=$controlBytes.ToArray();if($control.ExitCode-ne0-or!$peer.Pending()-or$bytes.Length-ne24-or[BitConverter]::ToUInt32($bytes,0)-ne0-or[BitConverter]::ToUInt32($bytes,20)-ne0){throw 'Native loopback positive control failed'}
           $control.Dispose();$controlBytes.Dispose()
          }finally{Stop-Server $p;$peer.Stop()}
          $observed|Set-Content build/native-sessions.responses.ndjson -Encoding utf8NoBOM
          $script:timings|ConvertTo-Json -Depth 10|Set-Content build/native-session-timings.json -Encoding utf8NoBOM
          Write-Output "Passed $($observed.Count) native request/response checks, isolated directories, publication verification and crash lease recovery"

      - name: Verify native sandbox timeout enforcement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Native([string[]]$Arguments){& $env:XAXC @Arguments;if($LASTEXITCODE-ne0){throw "Timeout fixture $($Arguments[0]) failed ($LASTEXITCODE)"}}
          Native @('verify','tests/security/timeout/timeout.xax','build/timeout.diag')
          Native @('resolve','tests/security/timeout/timeout.xax','build/timeout-snapshot.xax')
          Native @('build','build/timeout-snapshot.xax','build/timeout.exe','build/timeout.prov')
          if ((Get-FileHash build/timeout.exe).Hash -ne (Get-FileHash tests/security/timeout/timeout.exe).Hash) { throw 'Timeout artifact differs' }
          New-Item -ItemType Directory -Force build/timeout-sandbox | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $PWD 'build/timeout-sandbox/execute-stdin.bin'),[byte[]]@())
          [IO.File]::WriteAllBytes((Join-Path $PWD 'build/timeout-sandbox/execute-argv.bin'),[Text.Encoding]::Unicode.GetBytes('"prog.exe"'))
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & native/xax-mcp-sandbox.exe (Resolve-Path build/timeout.exe).Path (Resolve-Path build/timeout-sandbox).Path
          if ($LASTEXITCODE -ne 0) { throw 'Sandbox unavailable or failed' }
          $watch.Stop()
          $result = [IO.File]::ReadAllBytes((Join-Path $PWD 'build/timeout-sandbox/sandbox-result.bin'))
          if ($result.Length -ne 64 -or ([BitConverter]::ToUInt64($result,56))-ne1 -or ([BitConverter]::ToUInt32($result, 4) -band 1) -ne 1 -or $watch.ElapsedMilliseconds -lt 9000 -or $watch.ElapsedMilliseconds -gt 25000) { throw 'Sandbox failed to enforce wall timeout' }
          New-Item -ItemType Directory -Force build/termination-sandbox|Out-Null
          [IO.File]::WriteAllBytes((Join-Path $PWD 'build/termination-sandbox/execute-stdin.bin'),[byte[]]@(0,255,10))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'build/termination-sandbox/execute-argv.bin'),[Text.Encoding]::Unicode.GetBytes('"prog.exe"'))
          $launchInfo=[Diagnostics.ProcessStartInfo]::new((Join-Path $PWD 'native/xax-mcp-sandbox.exe'));$launchInfo.UseShellExecute=$false;$launchInfo.CreateNoWindow=$true
          $launchInfo.ArgumentList.Add((Join-Path $PWD 'build/timeout.exe'));$launchInfo.ArgumentList.Add((Join-Path $PWD 'build/termination-sandbox'))
          $launcher=[Diagnostics.Process]::Start($launchInfo);$child=$null;$worker=$null
          $workerImage=[IO.Path]::GetFullPath((Join-Path $PWD 'build/termination-sandbox/sandbox-run/prog.exe'))
          try{
           foreach($attempt in 1..30){$child=Get-CimInstance Win32_Process -Filter "ParentProcessId=$($launcher.Id)"|Where-Object{$_.ExecutablePath-eq$workerImage};if($null-ne$child){break};Start-Sleep -Milliseconds 100}
           if($null-eq$child){throw 'BLOCKED: contained termination-test child unavailable'}
           $worker=[Diagnostics.Process]::GetProcessById($child.ProcessId);if($worker.HasExited){throw 'Contained worker was not alive before termination'}
           $cleanupWatch=[Diagnostics.Stopwatch]::StartNew();$launcher.Kill();$launcher.WaitForExit()
           if(!$worker.WaitForExit(5000)){throw 'Child survived launcher termination'}
           if((Test-Path build/termination-sandbox/execute-stdin.bin)-or(Test-Path build/termination-sandbox/sandbox-result.bin)){throw 'Termination leaked stdin or published successful metadata'}
           @{launcher_terminated=$true;worker_pid=$child.ProcessId;worker_image=$workerImage;worker_alive_before_termination=$true;child_survived=$false;stdin_removed=$true;metadata_published=$false;cleanup_observed_ms=$cleanupWatch.ElapsedMilliseconds}|ConvertTo-Json|Set-Content build/executor-termination.json -Encoding utf8NoBOM
          }finally{if(!$launcher.HasExited){$launcher.Kill()};if($null-ne$worker){$worker.Dispose()};$launcher.Dispose()}

      - name: Replay and rebuild Android and inspection-pin previews
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $compiler=$env:XAXC
          function Native([string[]]$Arguments){& $compiler @Arguments;if($LASTEXITCODE-ne0){throw "Preview native operation failed: $($Arguments[0]) ($LASTEXITCODE)"}}
          function Same([string]$Actual,[string]$Expected){if((Get-FileHash -LiteralPath $Actual).Hash-ne(Get-FileHash -LiteralPath $Expected).Hash){throw "Preview bytes differ: $Actual"}}
          New-Item -ItemType Directory -Force build/preview-replay,build/preview-rebuild|Out-Null
          $manifest=Get-Content native/transactions/20261112-android/manifest.json -Raw|ConvertFrom-Json
          $current=@{}
          foreach($row in $manifest.records){
           if((Get-FileHash -LiteralPath $row.path).Hash.ToLowerInvariant()-ne$row.sha256){throw 'Android carrier identity differs'}
           $group=$row.group
           $base=if($group-eq'fixtures'-or!$current.ContainsKey($group)){$manifest.groups.$group.base}else{$current[$group]}
           $out=Join-Path build/preview-replay ([IO.Path]::GetFileNameWithoutExtension($row.path)+'.xax')
           Native @('edit',$base,$row.path,$out);Native @('verify',$out,($out+'.diag'))
           if((Get-FileHash -LiteralPath $out).Hash.ToLowerInvariant()-ne$row.result_source.sha256){throw 'Android replay source differs'}
           $current[$group]=$out
          }
          foreach($group in @('runner','host','server')){Same $current[$group] $manifest.groups.$group.final}
          $pins=Get-Content native/transactions/20261112-read-pins/manifest.json -Raw|ConvertFrom-Json
          $currentPin=$pins.base.path
          foreach($row in $pins.records){
           if((Get-FileHash -LiteralPath $row.path).Hash.ToLowerInvariant()-ne$row.sha256){throw 'Inspection-pin carrier identity differs'}
           $out=Join-Path build/preview-replay ([IO.Path]::GetFileNameWithoutExtension($row.path)+'.xax')
           Native @('edit',$currentPin,$row.path,$out);Native @('verify',$out,($out+'.diag'));$currentPin=$out
          }
          Same $currentPin $pins.final.path
          foreach($directory in @('20261112-android','20261112-read-pins')){
           $checkpoint=Get-Content "native/candidates/$directory/checkpoints.json" -Raw|ConvertFrom-Json
           foreach($item in $checkpoint.artifacts){if((Get-FileHash -LiteralPath $item.path).Hash.ToLowerInvariant()-ne$item.sha256-or(Get-Item -LiteralPath $item.path).Length-ne$item.bytes){throw 'Preview artifact identity differs'}}
          }
          function Rebuild([string]$Source,[string]$Snapshot,[string]$Binary,[string]$Provenance,[string]$Tag){
           $snap="build/preview-rebuild/$Tag.xax";Native @('resolve',$Source,$snap);Same $snap $Snapshot
           foreach($attempt in 1..2){$exe="build/preview-rebuild/$Tag-$attempt.bin";$prov="build/preview-rebuild/$Tag-$attempt.prov";Native @('build',$snap,$exe,$prov);Same $exe $Binary;Same $prov $Provenance}
          }
          foreach($snapshot in Get-ChildItem tests/android -Filter '*-snapshot.xax'){
           $name=$snapshot.Name.Replace('-snapshot.xax','');Rebuild "tests/android/$name.xax" $snapshot.FullName "tests/android/$name" "tests/android/$name.prov" $name
          }
          $candidate='native/candidates/20261112-android'
          Rebuild "$candidate/server.xax" "$candidate/server-snapshot.xax" "$candidate/xax-mcp-native.exe" "$candidate/xax-mcp-native.prov" 'android-server'
          Rebuild "$candidate/adb-host.xax" "$candidate/adb-host-snapshot.xax" "$candidate/xax-mcp-sandbox.exe" "$candidate/adb-host.prov" 'adb-host'
          Rebuild "$candidate/android-runner.xax" "$candidate/android-runner-snapshot.xax" "$candidate/android-runner" "$candidate/android-runner.prov" 'android-runner'
          $candidate='native/candidates/20261112-read-pins'
          Rebuild "$candidate/server.xax" "$candidate/server-snapshot.xax" "$candidate/xax-mcp-native.exe" "$candidate/xax-mcp-native.prov" 'inspection-pin-server'
          @{android_records=$manifest.records.Count;inspection_pin_records=$pins.records.Count;programs_double_built=13;device_execution='Separate connected-device evidence; no hosted device'}|ConvertTo-Json|Set-Content build/preview-rebuild-summary.json -Encoding utf8NoBOM


      - name: Assemble the native-only Windows preview package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory build/package,build/package/native,build/package/xax,build/package/docs,build/package/schemas | Out-Null
          Copy-Item native/* build/package/native/ -Recurse -Force
          Copy-Item .xax-upstream/compiler/bootstrap/windows/xaxc-windows-x86_64.exe,.xax-upstream/compiler/bootstrap/windows/seed.json build/package/xax/
          Copy-Item README.md build/package/
          Copy-Item docs/* build/package/docs/ -Recurse -Force
          Copy-Item schemas/* build/package/schemas/
          Copy-Item examples,tests,agent-guidance build/package/ -Recurse -Force
          Compress-Archive -Path build/package/* -DestinationPath build/xax-mcp-0.10.0-windows-x86_64-preview.zip

      - uses: actions/upload-artifact@v4
        with:
          name: xax-mcp-0.10.0-windows-x86_64-preview
          path: build/xax-mcp-0.10.0-windows-x86_64-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-evidence
          path: |
            build/readonly.responses.ndjson
            build/native-sessions.responses.ndjson
            build/native-session-timings.json
            build/executor-termination.json
            build/preview-rebuild-summary.json
            build/timeout-sandbox/sandbox-result.bin
            build/timeout-sandbox/sandbox-out.bin
            build/timeout-sandbox/sandbox-err.bin

  windows-jvm:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      XAXC: ${{ github.workspace }}/.xax-jvm-upstream/compiler/bootstrap/windows/xaxc-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - name: Check out the separate immutable JVM compiler
        uses: actions/checkout@v4
        with:
          repository: MrxSiN/XAX
          ref: 745e80150605f3812aa012e6884f6e417d9423b4
          path: .xax-jvm-upstream

      # Build/replay acceptance only. Runtime isolation uses the separately
      # inventoried Microsoft Java 17 installation in local evidence.
      - name: Replay JVM sources and rebuild native launchers and JARs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          trap {
           $message=$_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
           Write-Output "::error title=JVM replay and rebuild::$message"
           exit 1
          }
          $compiler=$env:XAXC
          $dependency=Get-Content native/jvm-dependency.json -Raw|ConvertFrom-Json
          if((Get-FileHash -LiteralPath $compiler).Hash.ToLowerInvariant()-ne$dependency.seed_sha256){throw 'Wrong JVM compiler seed'}
          $manifest=Get-Content native/transactions/20261112-jvm/manifest.json -Raw|ConvertFrom-Json -Depth 80
          New-Item -ItemType Directory -Force build/jvm/replay,build/jvm/rebuild | Out-Null
          function Native([string[]]$Arguments){& $compiler @Arguments;if($LASTEXITCODE-ne0){throw "Native JVM compiler declined: $($Arguments[0]) ($LASTEXITCODE)"}}
          function Identity($Row){if((Get-FileHash -LiteralPath $Row.path).Hash.ToLowerInvariant()-ne$Row.sha256-or(Get-Item -LiteralPath $Row.path).Length-ne$Row.bytes){throw "Identity differs: $($Row.path)"}}
          $count=0
          foreach($group in $manifest.groups){
           Identity $group.base
           $current="build/jvm/replay/$($group.name).current.xax";Copy-Item -LiteralPath $group.base.path -Destination $current -Force
           foreach($record in $group.records){
            Identity $record;Identity $record.native_batch
            $next="build/jvm/replay/$($group.name).next.xax"
            Native @('edit',$current,$record.path,$next)
            Native @('verify',$next,'build/jvm/replay/verify.diag')
            if((Get-FileHash -LiteralPath $next).Hash.ToLowerInvariant()-ne$record.result.sha256){throw 'JVM intermediate replay differs'}
            Move-Item -LiteralPath $next -Destination $current -Force
            $count++;Write-Output "Verified JVM source record $count"
           }
           Identity $group.final
           if((Get-FileHash -LiteralPath $current).Hash.ToLowerInvariant()-ne$group.final.sha256){throw 'JVM final replay differs'}
          }
          if($count-ne49){throw 'Incomplete JVM replay'}
          $checkpoint=Get-Content native/candidates/20261112-jvm/checkpoints.json -Raw|ConvertFrom-Json
          foreach($item in $checkpoint.artifacts){Identity $item}
          $candidate='native/candidates/20261112-jvm'
          foreach($program in @(@{name='server';source="$candidate/server.xax";snapshot="$candidate/server-snapshot.xax";exe="$candidate/xax-mcp-native.exe";prov="$candidate/xax-mcp-native.prov"},@{name='launcher';source="$candidate/jvm-launcher.xax";snapshot="$candidate/jvm-launcher-snapshot.xax";exe="$candidate/xax-mcp-sandbox.exe";prov="$candidate/jvm-launcher.prov"})){
           $snapshot="build/jvm/rebuild/$($program.name)-snapshot.xax"
           Native @('verify',$program.source,'build/jvm/rebuild/source.diag');Native @('resolve',$program.source,$snapshot)
           if((Get-FileHash -LiteralPath $snapshot).Hash-ne(Get-FileHash -LiteralPath $program.snapshot).Hash){throw 'JVM host snapshot differs'}
           foreach($attempt in 1..2){
            $exe="build/jvm/rebuild/$($program.name)-$attempt.exe";$prov="build/jvm/rebuild/$($program.name)-$attempt.prov"
            Native @('build',$snapshot,$exe,$prov)
            if((Get-FileHash -LiteralPath $exe).Hash-ne(Get-FileHash -LiteralPath $program.exe).Hash-or(Get-FileHash -LiteralPath $prov).Hash-ne(Get-FileHash -LiteralPath $program.prov).Hash){throw 'JVM native rebuild differs'}
           }
          }
          $fixtures=Get-Content tests/jvm/manifest.json -Raw|ConvertFrom-Json -Depth 80
          foreach($fixture in $fixtures.fixtures){
           Identity $fixture.source;Identity $fixture.jar;Identity $fixture.provenance
           Native @('verify',$fixture.source.path,'build/jvm/rebuild/fixture.diag')
           foreach($attempt in 1..2){
            $jar="build/jvm/rebuild/wordcount-v$($fixture.version)-$attempt.jar";$prov="build/jvm/rebuild/wordcount-v$($fixture.version)-$attempt.prov"
            Native @('build',$fixture.source.path,$jar,$prov)
            if((Get-FileHash -LiteralPath $jar).Hash.ToLowerInvariant()-ne$fixture.jar.sha256-or(Get-FileHash -LiteralPath $prov).Hash.ToLowerInvariant()-ne$fixture.provenance.sha256){throw 'JVM JAR or provenance differs'}
            $zip=[IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $jar))
            try{$classes=@($zip.Entries|Where-Object FullName -Like '*.class');if($classes.Count-ne1){throw 'Wrong JVM class count'};foreach($entry in $classes){$stream=$entry.Open();try{$header=[byte[]]::new(8);if($stream.Read($header,0,8)-ne8-or$header[0]-ne202-or$header[1]-ne254-or$header[2]-ne186-or$header[3]-ne190-or$header[6]*256+$header[7]-ne61){throw 'Wrong JVM classfile'}}finally{$stream.Dispose()}}}finally{$zip.Dispose()}
           }
          }
          Identity $fixtures.mutation_negative.record
          & $compiler edit $fixtures.mutation_negative.base.path $fixtures.mutation_negative.record.path build/jvm/replay/declined-snapshot.out
          if($LASTEXITCODE-ne1-or(Get-Content build/jvm/replay/declined-snapshot.out -Raw)-notmatch'XAX.WORKSPACE.TOPOLOGY'){throw 'Snapshot mutation boundary differs'}
          # The decline above is expected and verified. GitHub's pwsh wrapper
          # otherwise exits with this native test's nonzero LASTEXITCODE.
          $global:LASTEXITCODE=0
          @{records=$count;programs_double_built=4;compiler_sha256=$dependency.seed_sha256;runtime_execution='Separate exact local Java runtime evidence';release_ready=$false}|ConvertTo-Json|Set-Content build/jvm/summary.json -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v4
        with:
          name: native-jvm-build-evidence
          path: build/jvm/summary.json

  windows-jvm-mutation:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      XAXC: ${{ github.workspace }}/.xax-jvm-mutation-upstream/compiler/bootstrap/windows/xaxc-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - name: Check out the immutable JVM mutation compiler
        uses: actions/checkout@v4
        with:
          repository: MrxSiN/XAX
          ref: 02030f9ee1db7c2c7ead01ff0e20f17087a5fde3
          path: .xax-jvm-mutation-upstream

      # Java isolation and behavior use the separately inventoried local runtime.
      - name: Replay JVM mutation sources and rebuild changed programs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          trap {
           $message=$_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
           Write-Output "::error title=JVM mutation replay and rebuild::$message"
           exit 1
          }
          $compiler=$env:XAXC
          $dependency=Get-Content native/jvm-mutation-dependency.json -Raw|ConvertFrom-Json
          if((Get-FileHash -LiteralPath $compiler).Hash.ToLowerInvariant()-ne$dependency.seed_sha256){throw 'Wrong JVM mutation compiler'}
          function Native([string[]]$Arguments){& $compiler @Arguments;if($LASTEXITCODE-ne0){throw "Native mutation compiler failed: $($Arguments[0]) ($LASTEXITCODE)"}}
          function Identity($Row){if((Get-FileHash -LiteralPath $Row.path).Hash.ToLowerInvariant()-ne$Row.sha256-or(Get-Item -LiteralPath $Row.path).Length-ne$Row.bytes){throw "Identity differs: $($Row.path)"}}
          function Same([string]$A,[string]$B){if((Get-FileHash -LiteralPath $A).Hash-ne(Get-FileHash -LiteralPath $B).Hash){throw "Bytes differ: $A"}}
          New-Item -ItemType Directory -Force build/jvm-mutation/replay,build/jvm-mutation/rebuild | Out-Null
          $manifest=Get-Content native/transactions/20261113-jvm-mutation/manifest.json -Raw|ConvertFrom-Json -Depth 80
          $count=0
          foreach($group in $manifest.groups){
           Identity $group.base
           $current="build/jvm-mutation/replay/$($group.name).current.xax";Copy-Item -LiteralPath $group.base.path -Destination $current
           foreach($record in $group.records){
            Identity $record;Identity $record.native_batch
            $next="build/jvm-mutation/replay/$($group.name).next.xax"
            Native @('edit',$current,$record.path,$next);Native @('verify',$next,'build/jvm-mutation/replay/verify.diag')
            if((Get-FileHash -LiteralPath $next).Hash.ToLowerInvariant()-ne$record.result.sha256){throw 'Mutation intermediate replay differs'}
            Move-Item -LiteralPath $next -Destination $current -Force
            $count++
           }
           Identity $group.final;Same $current $group.final.path
          }
          if($count-ne$manifest.total_records){throw 'Incomplete mutation replay'}
          $candidate='native/candidates/20261113-jvm-mutation'
          foreach($program in @(@{name='server';source="$candidate/server.xax";snapshot="$candidate/server-snapshot.xax";exe="$candidate/xax-mcp-native.exe";prov="$candidate/xax-mcp-native.prov"},@{name='launcher';source="$candidate/jvm-launcher.xax";snapshot="$candidate/jvm-launcher-snapshot.xax";exe="$candidate/xax-mcp-sandbox.exe";prov="$candidate/jvm-launcher.prov"})){
           $snapshot="build/jvm-mutation/rebuild/$($program.name)-snapshot.xax"
           Native @('verify',$program.source,'build/jvm-mutation/rebuild/source.diag');Native @('resolve',$program.source,$snapshot);Same $snapshot $program.snapshot
           foreach($attempt in 1..2){
            $exe="build/jvm-mutation/rebuild/$($program.name)-$attempt.exe";$prov="build/jvm-mutation/rebuild/$($program.name)-$attempt.prov"
            Native @('build',$snapshot,$exe,$prov);Same $exe $program.exe;Same $prov $program.prov
           }
          }
          $fixtures=Get-Content tests/jvm/mutation/manifest.json -Raw|ConvertFrom-Json -Depth 80
          Identity $fixtures.base
          foreach($fixture in $fixtures.fixtures){
           Identity $fixture.base;Identity $fixture.record;Identity $fixture.source;Identity $fixture.jar;Identity $fixture.provenance
           $source="build/jvm-mutation/rebuild/$($fixture.name).xax"
           Native @('edit',$fixture.base.path,$fixture.record.path,$source);Native @('verify',$source,'build/jvm-mutation/rebuild/fixture.diag');Same $source $fixture.source.path
           foreach($attempt in 1..2){
            $jar="build/jvm-mutation/rebuild/$($fixture.name)-$attempt.jar";$prov="build/jvm-mutation/rebuild/$($fixture.name)-$attempt.prov"
            Native @('build',$source,$jar,$prov);Same $jar $fixture.jar.path;Same $prov $fixture.provenance.path
           }
           & $compiler edit $source $fixture.record.path build/jvm-mutation/replay/stale.out
           if($LASTEXITCODE-ne1){throw 'Stale mutation was not rejected'}
           Same $source $fixture.source.path
          }
          foreach($negative in $fixtures.rejections){
           Identity $negative.record
           $out='build/jvm-mutation/replay/rejected.out'
           & $compiler edit $fixtures.base.path $negative.record.path $out
           if($LASTEXITCODE-ne$negative.native_edit_exit){throw 'Mutation rejection edit boundary differs'}
           if($negative.native_edit_exit-eq0){& $compiler verify $out build/jvm-mutation/replay/rejected.diag;if($LASTEXITCODE-ne1){throw 'Invalid candidate passed verification'}}
           Identity $fixtures.base
          }
          $checkpoint=Get-Content "$candidate/checkpoints.json" -Raw|ConvertFrom-Json
          foreach($item in $checkpoint.artifacts){Identity $item}
          # All expected native rejection statuses above have been asserted.
          $global:LASTEXITCODE=0
          @{records=$count;build_cases_double_built=(2+$fixtures.fixtures.Count);compiler_sha256=$dependency.seed_sha256;runtime_execution='Separate exact local Java runtime evidence';release_ready=$false}|ConvertTo-Json|Set-Content build/jvm-mutation/summary.json -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v4
        with:
          name: native-jvm-mutation-build-evidence
          path: build/jvm-mutation/summary.json
