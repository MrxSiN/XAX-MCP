name: native-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check native artifact identities
        shell: pwsh
        run: |
          $expected = @{
            'native/xax-mcp-native.exe' = '9F6E272BBBC938D3493A98B7C68409DE31A09FFC4CC958BB41BE7447B65C076A'
            'native/xax-mcp-sandbox.exe' = '6D563E0F23E4F402D55C82B200D42BCE91C41C98AAB101267E67D3645A1D37E2'
            'native/xax-mcp-seed.exe' = '8FAAEB7E63E5D1A07BCD9C46E3AE3381AF267B67E213CEC6B992C628FB1843CA'
            'examples/native-arithmetic/program.xax' = '3454B07D7D958D8B15323D9D5A6E633DB69B3449357B5F9FC78D9A22262D7658'
            'examples/native-arithmetic/program.exe' = '832A06E874A109C4CDAF4385E0B50E88B7B8070EE532DA6544E3568EAEDD2A07'
            'examples/native-arithmetic/program.prov' = '960F8960AFA106238FA283FB89EE07974106C35CA033C0D91CB692327B5A32E4'
          }
          foreach ($path in $expected.Keys) {
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected[$path]) {
              throw "Native artifact changed: $path"
            }
          }

      # PowerShell and Git are external CI orchestration. No compiler implementation,
      # SDK, source emitter or non-XAX runtime helper is installed or executed.
      - name: Replay the STDIO protocol smoke fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $actual = @(Get-Content tests/protocol/readonly.requests.ndjson | & native/xax-mcp-native.exe --read-only)
          if ($LASTEXITCODE -ne 0) { throw 'Native server failed' }
          $actual | Set-Content build/readonly.responses.ndjson -Encoding utf8NoBOM
          $expected = @(Get-Content tests/protocol/readonly.responses.ndjson)
          if ($actual.Count -ne $expected.Count -or (Compare-Object $expected $actual -SyncWindow 0)) {
            throw 'STDIO response fixture differs'
          }

      - name: Run the new canonical arithmetic program in native confinement
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/sandbox | Out-Null
          & native/xax-mcp-sandbox.exe (Resolve-Path examples/native-arithmetic/program.exe).Path (Resolve-Path build/sandbox).Path
          if ($LASTEXITCODE -ne 0) { throw "Confinement unavailable or failed: $LASTEXITCODE" }
          $result = [IO.File]::ReadAllBytes((Join-Path $PWD 'build/sandbox/sandbox-result.bin'))
          if ($result.Length -ne 16 -or [BitConverter]::ToUInt32($result, 0) -ne 136 -or [BitConverter]::ToUInt32($result, 4) -ne 0) {
            throw 'Expected confined exit result 136 with no timeout or truncation'
          }
          if ((Get-Item build/sandbox/sandbox-out.bin).Length -ne 0 -or (Get-Item build/sandbox/sandbox-err.bin).Length -ne 0) {
            throw 'Unexpected artifact output'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: native-smoke-evidence
          path: |
            build/readonly.responses.ndjson
            build/sandbox/sandbox-result.bin
            build/sandbox/sandbox-out.bin
            build/sandbox/sandbox-err.bin
