name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The MCP authoring tooling and tests. This is the certified compiler revision (3e9b0c2, XAX main) plus the MCP
  # commits; its compiler/src is byte-identical to the pin, which is what the store embeds and what the server reports.
  XAX_COMMIT: 6b6c35939ff02c365a58c3534cf1b75a2281d393
  XAX_COMPILER_COMMIT: 3e9b0c2b3f88d2193caae72a5fe8eefa83d1995b
  XAX_MCP_HOME: ${{ github.workspace }}

jobs:
  native-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Isolated checkout of the pinned upstream XAX (authoring tooling and tests)
        uses: actions/checkout@v4
        with:
          repository: MrxSiN/XAX
          ref: ${{ env.XAX_COMMIT }}
          path: upstream-xax
          fetch-depth: 0

      - name: The tooling commit must carry exactly the certified compiler revision
        shell: bash
        run: |
          git -C upstream-xax cat-file -e "$XAX_COMPILER_COMMIT^{commit}"
          git -C upstream-xax diff --exit-code "$XAX_COMPILER_COMMIT" HEAD -- compiler/src
          echo "compiler/src is byte-identical to $XAX_COMPILER_COMMIT"

      - name: This repository contains no Python and no source code
        shell: bash
        run: |
          test -z "$(git ls-files '*.py')"
          test ! -d .venv
          echo "no tracked Python; carriers, stores, executables, evidence, docs only"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Python here is external test tooling and the offline carrier author (B5 in docs/NATIVE.md). It is never
      # packaged with, imported by, or launched by the server, and the committed carriers rebuild without it.
      - name: Install the external test client
        run: |
          python -m pip install pytest anyio "mcp>=2.3.0,<2.4"

      - name: Re-emit the carriers and stores with the pinned offline authors
        run: |
          python -B upstream-xax/compiler/integration/mcp/server.py  upstream-xax/compiler/src build
          python -B upstream-xax/compiler/integration/mcp/sandbox.py upstream-xax/compiler/src build
          python -B upstream-xax/compiler/integration/mcp/seed.py    upstream-xax/compiler/src build

      - name: The regenerated carriers and stores must equal the committed ones byte for byte
        shell: pwsh
        run: |
          # The executables are build products (not committed); the six carriers, stores and snapshots are.
          git ls-files native | ForEach-Object {
            $name = Split-Path $_ -Leaf
            $built = Join-Path build $name
            if (-not (Test-Path $built)) { throw "the build did not produce $name" }
            $a = (Get-FileHash $built -Algorithm SHA256).Hash
            $b = (Get-FileHash $_ -Algorithm SHA256).Hash
            if ($a -ne $b) { throw "artifact differs from the committed one: $name" }
            "ok $name $a"
          }
          foreach ($exe in "xax-mcp-native.exe", "xax-mcp-sandbox.exe", "xax-mcp-seed.exe") {
            if (-not (Test-Path (Join-Path build $exe))) { throw "the build did not produce $exe" }
          }

      - name: The built server reports the pin and starts no Python
        shell: pwsh
        run: |
          $request = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"xax_capabilities","arguments":{}}}'
          ) -join "`n"
          $out = ($request | & build/xax-mcp-native.exe --read-only) -join "`n"
          $payload = ($out -split "`n" | Where-Object { $_ -match '"id":2' } | ConvertFrom-Json).result.content[0].text | ConvertFrom-Json
          if ($payload.server.version -ne "0.8.0+native") { throw "version $($payload.server.version)" }
          if ($payload.xax.pinned_commit -ne "$env:XAX_COMPILER_COMMIT") { throw "pin $($payload.xax.pinned_commit)" }
          if ($payload.server.python_on_request_path -ne $false) { throw "python_on_request_path" }
          if ($payload.xax.host_contract -ne "xax-host-contract-v1 r10") { throw "contract $($payload.xax.host_contract)" }
          "identity ok: $($payload.server.version) $($payload.xax.pinned_commit)"

      - name: Drive the PE32+ over STDIO (the suite lives in XAX; the artifacts under test are committed here)
        env:
          XAX_NATIVE_SRC: ${{ github.workspace }}\upstream-xax\compiler\src
        run: python -m pytest -q -rs upstream-xax/compiler/integration/mcp/tests

      - name: Record protocol measurements (artifact only; committed evidence is curated by hand)
        run: python upstream-xax/compiler/integration/mcp/bench.py build/xax-mcp-native.exe > evidence-native.json

      - uses: actions/upload-artifact@v4
        with:
          name: native-evidence
          path: evidence-native.json
