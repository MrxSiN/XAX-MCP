name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  XAX_COMMIT: f79b532fd4651ba808676d02f4b038e2cc271e6a

jobs:
  native-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Isolated checkout of the pinned upstream XAX (build toolchain only)
        uses: actions/checkout@v4
        with:
          repository: MrxSiN/XAX
          ref: ${{ env.XAX_COMMIT }}
          path: upstream-xax

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install external test client and the pinned XAX build toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest anyio "mcp>=2.3.0,<2.4" -e upstream-xax/compiler

      - name: Build the native XAX server from the pinned compiler
        run: python native/server.py upstream-xax/compiler/src native

      - name: Verify the committed store and drive the PE32+ over STDIO
        env:
          XAX_NATIVE_SRC: ${{ github.workspace }}\upstream-xax\compiler\src
        run: python -m pytest -q -rs

      - name: Record protocol measurements (artifact only; committed evidence is curated by hand)
        run: python native/bench.py native/xax-mcp-native.exe > evidence-native.json

      - uses: actions/upload-artifact@v4
        with:
          name: native-evidence
          path: evidence-native.json
