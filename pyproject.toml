[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xax-mcp"
version = "0.7.0"
description = "Native XAX MCP server: an XAX-built Windows x86-64 STDIO executable"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "See repository" }
# No runtime dependencies.  The deployed server is native/xax-mcp-native.exe, built from a canonical XAX store.
dependencies = []

[project.optional-dependencies]
# Test-client only.  Nothing here is imported by the deployed server.
test = [
    "pytest>=8",
    "anyio>=4",
    "mcp>=2.3.0,<2.4",
]

[project.urls]
Repository = "https://github.com/MrxSiN/XAX-MCP"
Upstream = "https://github.com/MrxSiN/XAX"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
