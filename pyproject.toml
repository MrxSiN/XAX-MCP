[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xax-mcp"
version = "0.5.1"
description = "Optional MCP server exposing XAX semantic construction, transactions, builds, and sandboxed execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "See repository" }
dependencies = [
    # Official MCP Python SDK, tested at 2.3.0 (protocol 2026-07-28 and handshake-era 2025-11-25).
    "mcp>=2.3.0,<2.4",
    # Upstream XAX toolchain, pinned to an immutable commit (see src/xax_mcp/compat.py and docs/COMPATIBILITY.md).
    "xax-compiler @ git+https://github.com/MrxSiN/XAX@f0aa191424f6e404004f96422eb8a032ef8a1bb2#subdirectory=compiler",
]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
xax-mcp = "xax_mcp.server:main"

[project.urls]
Repository = "https://github.com/MrxSiN/XAX-MCP"
Upstream = "https://github.com/MrxSiN/XAX"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
